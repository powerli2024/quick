[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kws-quick-route"
version = "0.1.0"
description = "Strict s1/s7 MossFormer SE route evaluation and auditable flat export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
zh = ["pypinyin>=0.49"]
dev = ["pytest>=7", "pypinyin>=0.49"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
